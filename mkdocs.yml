site_name: XPCS Power User Tools
site_description: Documentation for XPCS Power User Tools - A collection of utilities for XPCS data analysis
site_author: Miaoqi Chu
site_url: https://github.com/AZjk/poweruser

repo_name: AZjk/poweruser
repo_url: https://github.com/AZjk/poweruser

theme:
  name: material
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Modules:
    - convert_legacy_datasets: convert_legacy_datasets.md
    - convert_nexus_to_csv: convert_nexus_to_csv.md
    - xpcs_functions: xpcs_functions.md
  - API Reference:
    - Overview: api/index.md
    - CLI:
      - cli: api/cli.md
    - Utils:
      - convert_legacy_datasets: api/convert_legacy_datasets.md
      - convert_nexus_to_csv: api/convert_nexus_to_csv.md
      - xpcs_functions: api/xpcs_functions.md

markdown_extensions:
  - admonition
  - codehilite:
      guess_lang: false
  - toc:
      permalink: true
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: true
            show_root_heading: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/AZjk/poweruser

copyright: Copyright &copy; 2024 - XPCS Power User Tools
