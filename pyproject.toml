[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xpcs-poweruser"
version = "0.1.0"
description = "XPCS Power User Tools - A collection of utilities for XPCS data analysis"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "XPCS Team", email = "xpcs@example.com"},
]
keywords = ["xpcs", "data-analysis", "synchrotron", "x-ray"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "h5py>=3.0.0",
    "tqdm>=4.60.0",
    "click>=8.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.900",
]

[project.scripts]
xpcs-poweruser = "xpcs_poweruser.cli:main"

[project.urls]
Homepage = "https://github.com/AZjk/poweruser"
Repository = "https://github.com/AZjk/poweruser"
Issues = "https://github.com/AZjk/poweruser/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["xpcs_poweruser*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
xpcs_poweruser = ["utils/sample_metadata.hdf", "utils/*/G2average_info.json", "utils/*/reaverage_info.json"]
