[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "poweruser-xpcs"
version = "0.1.0"
description = "XPCS Power User Tools - A collection of utilities for XPCS data analysis"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Miaoqi Chu", email = "mqichu@anl.gov"},
]
keywords = ["xpcs", "data-analysis", "synchrotron", "x-ray"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=1.20.0",
    "scipy>=1.7.0",
    "h5py>=3.0.0",
    "tqdm>=4.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov>=2.0",
    "black>=22.0",
    "flake8>=4.0",
    "mypy>=0.900",
    "isort>=5.0",
]
docs = [
    "mkdocs>=1.5",
    "mkdocs-material>=9.0",
    "mkdocstrings[python]>=0.24",
    "sphinx>=7.0",
    "sphinx-rtd-theme>=2.0",
    "myst-parser>=2.0",
]
examples = [
    "matplotlib",
    "hdf5plugin",
    "xpcs-viewer",
    "jupyterlab",
    "ipython",
]

[project.scripts]
xpcs-poweruser = "poweruser_xpcs.cli:main"

[project.urls]
Homepage = "https://github.com/AZjk/poweruser"
Repository = "https://github.com/AZjk/poweruser"
Issues = "https://github.com/AZjk/poweruser/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["poweruser_xpcs*"]
exclude = ["tests*"]

[tool.setuptools.package-data]
poweruser_xpcs = ["utils/sample_metadata.hdf", "utils/*/G2average_info.json", "utils/*/reaverage_info.json"]
